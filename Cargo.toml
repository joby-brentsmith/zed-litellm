[package]
name = "zed-litellm"
version = "0.1.0"
edition = "2021"
description = "Sync models from a LiteLLM proxy into Zed's openai_compatible provider settings"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
jsonc-parser = { version = "0.33", features = ["cst", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
